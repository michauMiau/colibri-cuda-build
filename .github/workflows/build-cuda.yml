name: Build Colibri with CUDA

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if no new release'
        required: false
        type: boolean
        default: false

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      release_tag: ${{ steps.check.outputs.release_tag }}
      release_hash: ${{ steps.check.outputs.release_hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new Colibri release
        id: check
        run: |
          set -euo pipefail

          # Latest published release from upstream.
          LATEST_RELEASE=$(curl -sf https://api.github.com/repos/JustVugg/colibri/releases/latest | jq -r '.tag_name')
          if [ -z "$LATEST_RELEASE" ] || [ "$LATEST_RELEASE" = "null" ]; then
            echo "!!! could not read the upstream release tag" >&2
            exit 1
          fi

          # The commit the release was cut from, not target_commitish.
          #
          # target_commitish is the BRANCH a release was published from, so for
          # an ordinary release it reads "main". It was being written into
          # VERSION.txt as "Build hash: main", into the release body as
          # "Build commit: main", and used as the checkout ref in the clone
          # fallback, none of which is a fixed source. A branch moves, so two
          # builds of the same tag could come from different trees.
          #
          # The tag ref may be an annotated tag object rather than a commit, so
          # dereference it. Verified: git/ref/tags/v1.12.1 is a "tag" object
          # whose object is commit ce370e87, and that is exactly what
          # `git clone --branch v1.12.1` checks out.
          TAG_OBJECT=$(curl -sf "https://api.github.com/repos/JustVugg/colibri/git/ref/tags/${LATEST_RELEASE}" | jq -r '.object.sha')
          if [ -z "$TAG_OBJECT" ] || [ "$TAG_OBJECT" = "null" ]; then
            echo "!!! could not resolve the ref for $LATEST_RELEASE" >&2
            exit 1
          fi
          TAG_TYPE=$(curl -sf "https://api.github.com/repos/JustVugg/colibri/git/ref/tags/${LATEST_RELEASE}" | jq -r '.object.type')
          if [ "$TAG_TYPE" = "tag" ]; then
            RELEASE_HASH=$(curl -sf "https://api.github.com/repos/JustVugg/colibri/git/tags/${TAG_OBJECT}" | jq -r '.object.sha')
          else
            RELEASE_HASH="$TAG_OBJECT"
          fi
          if [ -z "$RELEASE_HASH" ] || [ "$RELEASE_HASH" = "null" ]; then
            echo "!!! could not resolve a commit for $LATEST_RELEASE" >&2
            exit 1
          fi

          echo "Latest colibri release: $LATEST_RELEASE"
          echo "Release commit: $RELEASE_HASH"

          # Anchored on purpose. Unanchored, v1.12.1 would also match v1.12.10
          # and v1.12.1-rc1, and a genuinely new release would be skipped.
          if git tag | grep -q "^${LATEST_RELEASE}$"; then
            echo "Release $LATEST_RELEASE already built"
            if [ "${{ inputs.force_build }}" = "true" ]; then
              echo "Force build enabled, building anyway"
              echo "should_build=true" >> $GITHUB_OUTPUT
            else
              echo "should_build=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "New release detected: $LATEST_RELEASE"
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

          echo "release_tag=$LATEST_RELEASE" >> $GITHUB_OUTPUT
          echo "release_hash=$RELEASE_HASH" >> $GITHUB_OUTPUT

  build:
    needs: check-release
    if: needs.check-release.outputs.should_build == 'true'
    runs-on: ${{ matrix.arch.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        cuda_version: ['12.8.1']
        arch:
          # Native runners — no QEMU. nvidia/cuda:*-cudnn-devel-ubuntu22.04 is
          # multi-arch on Docker Hub so the same build path runs on both.
          - { suffix: amd64, runs_on: ubuntu-latest }
#          - { suffix: arm64, runs_on: ubuntu-24.04-arm }
        include:
          - cuda_version: '12.8.1'
            cuda_version_short: '12.8'
            cuda_tag: '12.8.1-cudnn-devel-ubuntu22.04'
            # CUDA compute capabilities target the runtime GPU, not the host
            # CPU arch, so the same list applies to both amd64 and arm64
            # builds. Relevant aarch64 GPU contexts (Grace Hopper, Grace
            # Blackwell, DGX Spark) are covered by sm_90 / sm_100 / sm_120.
            architectures: '75-virtual;80-virtual;86-virtual;89-virtual;90-virtual;100-virtual;120-virtual'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize build space
        run: |
          echo "=== Initial Disk Space ==="
          df -h
          
          echo "=== Removing unnecessary packages ==="
          sudo apt-get remove -y '^aspnetcore-.*' || true
          sudo apt-get remove -y '^dotnet-.*' --fix-missing || true
          sudo apt-get remove -y '^llvm-.*' --fix-missing || true
          sudo apt-get remove -y 'php.*' --fix-missing || true
          sudo apt-get remove -y '^mongodb-.*' --fix-missing || true
          sudo apt-get remove -y '^mysql-.*' --fix-missing || true
          sudo apt-get remove -y azure-cli google-chrome-stable firefox powershell mono-devel libgl1-mesa-dri --fix-missing || true
          #sudo apt-get autoremove -y || true
          #sudo apt-get clean || true
          
          echo "=== Removing large directories ==="
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          #sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          
          # Clean docker system
          #docker system prune -af || true
          
          echo "=== After Cleanup ==="
          df -h

      - name: Build Colibri with CUDA
        run: |
          # Pull Docker image
          docker pull nvidia/cuda:${{ matrix.cuda_tag }}
          
          # Run build in container
          docker run --rm \
            -v $PWD:/workspace \
            nvidia/cuda:${{ matrix.cuda_tag }} \
            bash -c "
              set -e
              
              echo '=== Installing minimal dependencies ==='
              apt-get update -qq
              apt-get install -y --no-install-recommends git make build-essential libssl-dev ca-certificates
              apt-get clean
              rm -rf /var/lib/apt/lists/*
              
              echo '=== Cloning Colibri ==='
              cd /workspace
              # The release tag is the primary source. The commit from
              # check-release is the fallback and is now a real sha rather than
              # a branch name, so this checkout is reproducible.
              git clone --depth 1 --branch ${{ needs.check-release.outputs.release_tag }} https://github.com/JustVugg/colibri.git || \
                (git clone https://github.com/JustVugg/colibri.git && cd colibri && git checkout ${{ needs.check-release.outputs.release_hash }})
              cd colibri
              # Every line here is built with `cat` and redirection, never with
              # a substitution. This block lives inside the one double-quoted
              # argument to bash -c, so the runner's shell expands a substitution and
              # an expansion before the container exists. Run 36988301671 died from
              # exactly that: the sha lookup was resolved against
              # colibri-cuda-build's own checkout, not the Colibri clone, the
              # comparison failed, and the container aborted before it staged
              # the runtime. The symptom appeared two steps later as a
              # misleading "cuda-runtime not staged".
              echo '=== Source under build ==='
              echo "  tag:      ${{ needs.check-release.outputs.release_tag }}"
              echo "  expected: ${{ needs.check-release.outputs.release_hash }}"
              git rev-parse HEAD > binaries/cuda-${{ matrix.cuda_version_short }}/.colibri-commit
              cat binaries/cuda-${{ matrix.cuda_version_short }}/.colibri-commit
              
              echo '=== Configuring build with Ninja ==='
              # Prove the search path instead of assuming it. The soname symlink
              # this used to create is not in the 12.8.1 image, and `ln -sf` does
              # not create the containing directory, so run 36989594064 died with
              #   ln: failed to create symbolic link .../libcuda.so.1:
              #       No such file or directory
              # and the mkdir added as a fix hit
              #   mkdir: cannot create directory '/usr/local/cuda': Permission denied
              # because the container does not run as root. So the directory is
              # not created and the symlink is not made; what has to be checked
              # instead is whether libcuda is resolvable without them.
              echo "--- cuda tree as the container sees it ---"
              ls -ld /usr/local/cuda 2>&1
              ls -l /usr/local/cuda/lib64 2>&1 | head -20
              echo "--- stubs ---"
              ls -l /usr/local/cuda/lib64/stubs 2>&1
              echo "--- is libcuda resolvable at all? ---"
              ldconfig -p 2>/dev/null | grep -c libcuda || echo "0"
              # CUDA_ARCH=portable is mandatory here, not an optimisation. The
              # runner has no GPU, so nvcc cannot resolve -arch=native and
              # silently falls back to a single default arch -- the shipped
              # binary then dies at first kernel dispatch on any card that is
              # not that default. 'portable' emits SASS for sm_80/86/89/90/120
              # plus a compute_120 PTX fallback (sm_121 joins when nvcc >= 12.9).
              # See the CUDA target selection block in c/Makefile.
              # -o pipefail BEFORE the pipe: set after it, the flag never
              # applies to the pipeline and a failed `make` exits 0 via tee.
              set -o pipefail
              CUDA=1 CUDA_ARCH=portable make -C c qwen38 2>&1 | tee /tmp/build.log

              #echo '=== Building with Ninja (parallel: all cores) ==='
              #make --build build --config Release -j\nproc
              
              echo '=== Copying binaries ==='
              cd /workspace
              mkdir -p binaries/cuda-${{ matrix.cuda_version_short }}
              
              # Remove everything except binaries
              rm -fr colibri/c/*.c 
              rm -fr colibri/c/*.h
              rm -fr colibri/c/tests 
              rm -fr colibri/c/shaders
              rm -fr colibri/c/*.cmd
              rm -fr colibri/c/*.ps1
              rm -fr colibri/c/Makefile*
              rm -fr colibri/c/*.cu
              rm -fr colibri/c/*.mm
              rm colibri/c/.gitignore
              # Copy everything from build/bin
              cp -r colibri/c/* binaries/cuda-${{ matrix.cuda_version_short }}
              

              
              # Strip binaries to reduce size (executables only, not .so files)
              #find binaries/cuda-${{ matrix.cuda_version_short }}/ -type f -executable ! -name "*.so*" -exec strip {} \; 2>/dev/null || true

              echo '=== Staging the CUDA runtime for the bundling step ==='
              # Assert the staging HERE, inside the container, where the source
              # and the destination can both be seen. The bundling step found
              # cuda-runtime/libcudart.so.12 missing and could only report
              # that, with no way to say whether the copy never ran, ran against
              # a glob that matched nothing, or ran and something removed it.
              #
              # Run 36994417357 built successfully and then failed two steps
              # later on exactly this, and the log did not contain the
              # container's stdout at all, so there was nothing to read. Each
              # check below names the thing it rules out.
              echo "  glob result:"
              ls -l /usr/local/cuda/lib64/libcudart.so.12.* 2>&1
              echo "  staging dir before copy:"
              ls -ld /workspace/cuda-runtime 2>&1
              mkdir -p /workspace/cuda-runtime
              cp -L /usr/local/cuda/lib64/libcudart.so.12.* \
                    /workspace/cuda-runtime/libcudart.so.12
              chmod 0755 /workspace/cuda-runtime/libcudart.so.12
              # The versioned soname, not the libcudart.so.12 symlink: that
              # symlink is a toolchain artifact and would dangle for anyone who
              # extracts the tarball without the toolkit.
              ls -l /workspace/cuda-runtime/
              # Prove the copy landed and is a real library, not an empty file
              # from a failed cp. Both failures reported above would pass a
              # bare -f test, so the size is compared against the source.
              echo "  source size:"
              stat -c %s /usr/local/cuda/lib64/libcudart.so.12.* 2>&1
              echo "  staged size:"
              stat -c %s /workspace/cuda-runtime/libcudart.so.12
              if [ ! -s /workspace/cuda-runtime/libcudart.so.12 ]; then
                echo "!!! staging produced an empty or missing file" >&2
                exit 1
              fi
              # Confirms it is an ELF shared object, so a bad copy is caught
              # here rather than by a loader error on a user machine.
              file /workspace/cuda-runtime/libcudart.so.12 2>&1 || true
              echo "=== Staging verified ==="

              echo '=== Creating version info ==='
              # No the date here. It would be expanded by the runner rather than
              # the container, which happens to give the same day but is the
              # runner's clock and timezone, not the build's. The bundling step
              # appends the real build date where the shell is the runner's own.
              echo 'Colibri version: ${{ needs.check-release.outputs.release_tag }}' > binaries/cuda-${{ matrix.cuda_version_short }}/VERSION.txt
              echo 'CUDA version: ${{ matrix.cuda_version }}' >> binaries/cuda-${{ matrix.cuda_version_short }}/VERSION.txt
              echo 'Architectures: ${{ matrix.architectures }}' >> binaries/cuda-${{ matrix.cuda_version_short }}/VERSION.txt

              echo '=== Build complete ==='
              ls -lh binaries/cuda-${{ matrix.cuda_version_short }}/
              
              echo '=== Cleaning up build directory ==='
              rm -rf colibri
            "
          
          # Remove Docker image to free space
          docker rmi nvidia/cuda:${{ matrix.cuda_tag }} || true
          
          # Fix permissions for files created by root in container
          sudo chown -R $(id -u):$(id -g) $PWD
          
          echo "=== Final disk usage ==="
          df -h

      - name: Bundle the CUDA runtime
        # Separate from the container step on purpose. That step's body is one
        # double-quoted argument to bash -c, so the runner's shell expands every
        # $VAR and $( ) before the container sees it, and an escaped dollar
        # survives as a literal backslash instead. Two runs went red on exactly
        # that: 36792216381 (cd with an emptied argument) and 36793568938
        # (syntax error on the escaped form). Here ordinary shell quoting works.
        run: |
          set -euo pipefail
          # patchelf rewrites the engine's RUNPATH below. It is not preinstalled
          # on ubuntu-latest, and the rewrite is the whole reason the tarball
          # works without a system CUDA, so install it explicitly rather than
          # discovering the failure as a mysterious 127 later.
          if ! command -v patchelf >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq patchelf
          fi
          patchelf --version

          OUT="binaries/cuda-${{ matrix.cuda_version_short }}"
          # List the tree BEFORE anything is created or removed. The container's
          # own stdout is absent from the run log on this runner, so the only
          # place that can show what survived the build step is here, on the
          # workspace it shares with the container.
          echo "--- workspace as the runner sees it ---"
          ls -la .
          echo "--- cuda-runtime ---"
          ls -la cuda-runtime 2>&1
          echo "--- $OUT ---"
          ls -la "$OUT" 2>&1
          echo "--------------------------------"
          RUNTIME=cuda-runtime/libcudart.so.12
          if [ ! -f "$RUNTIME" ]; then
            echo "!!! $RUNTIME not staged by the container step" >&2
            echo "!!! the tree above shows what the build step left behind" >&2
            exit 1
          fi

          # The container wrote the commit it actually built into this file.
          # The comparison is here, not in the container, because that step's
          # body is one double-quoted argument to bash -c where the runner
          # expands $( ) and ${ } itself; see the comment at the clone.
          BUILT_COMMIT_FILE="$OUT/.colibri-commit"
          BUILT_COMMIT=$(cat "$BUILT_COMMIT_FILE" 2>/dev/null || echo '')
          EXPECTED_COMMIT="${{ needs.check-release.outputs.release_hash }}"
          if [ -z "$BUILT_COMMIT" ]; then
            echo "!!! no commit recorded in $BUILT_COMMIT_FILE" >&2
            exit 1
          fi
          case "$BUILT_COMMIT" in
            "$EXPECTED_COMMIT"*) ;;
            *)
              echo "!!! built $BUILT_COMMIT but the gate resolved $EXPECTED_COMMIT" >&2
              exit 1
              ;;
          esac
          echo "commit check: $BUILT_COMMIT matches the gate"
          # It has served its purpose in the tarball, where VERSION.txt is the
          # place a user looks. Appended here, from the sha the build recorded,
          # so the file cannot claim a commit the build did not use. Writing it
          # in the container would need a $( ) that the runner would expand
          # against its own repository.
          echo "Colibri commit: $BUILT_COMMIT" >> "$OUT/VERSION.txt"
          # The build date is taken here, where the shell really is the
          # runner's, rather than inside the container body where $(date) would
          # be the runner's too but by way of an expansion nobody can see.
          echo "Build date: $(date -u +%Y-%m-%d)" >> "$OUT/VERSION.txt"
          rm -f "$BUILT_COMMIT_FILE"

          echo "--- VERSION.txt as shipped ---"
          cat "$OUT/VERSION.txt"
          echo "----------------------------"
          mkdir -p "$OUT/lib"
          install -m 0755 "$RUNTIME" "$OUT/lib/libcudart.so.12"
          echo "bundled $(du -h "$OUT/lib/libcudart.so.12" | cut -f1)"

          # Rewrite the engine's RUNPATH so the bundle beside it is found.
          #
          # qwen38 ships with RUNPATH=/usr/local/cuda/lib64, an absolute path
          # that only exists on a machine with the toolkit. patchelf points it
          # at $ORIGIN/lib instead, and the loader expands $ORIGIN to the
          # directory holding the executable. Result: ./qwen38 works with the
          # CUDA runtime in ./lib, no wrapper, no LD_LIBRARY_PATH, no CUDA_HOME.
          #
          # Measured on a host with no CUDA installed at all: the bare binary
          # exits 127 with "error while loading shared libraries: libcudart"
          # before the rewrite, exits 1 (its own argument check) after, and
          # goes back to 127 when lib/libcudart.so.12 is renamed away. The
          # bundle is what makes it run, not the environment.
          #
          # Only qwen38 is patched. coli is a Python launcher, not an ELF, and
          # it detects CUDA with ldd on the engine it starts, so it picks up
          # the patched binary on its own. Running patchelf on it would abort
          # the step with "not an ELF executable".
          for tool in qwen38; do
            patchelf --set-rpath '$ORIGIN/lib' "$OUT/$tool"
          done

          # Verify rather than trust: $ORIGIN has to survive as a literal, and
          # the absolute path has to be gone, or the loader would keep
          # preferring it and never look in lib/.
          if ! readelf -d "$OUT/qwen38" | grep -Fq '$ORIGIN/lib'; then
            echo "!!! qwen38 RUNPATH was not rewritten" >&2
            readelf -d "$OUT/qwen38" | grep -E 'RPATH|RUNPATH' >&2
            exit 1
          fi
          if readelf -d "$OUT/qwen38" | grep -Fq '/usr/local/cuda'; then
            echo "!!! qwen38 still carries the absolute CUDA path" >&2
            exit 1
          fi
          echo 'RUNPATH is now $ORIGIN/lib on qwen38'

          # The wrapper stays as a fallback for anyone who copies the binary
          # out of the tarball layout, where $ORIGIN/lib no longer points at
          # the bundle. It also sets CUDA_HOME, which is what colibri's own
          # CUDA_HOME lookup reads.
          sed 's/BINARY_NAME/qwen38/' scripts/run-with-bundled-cuda.sh > "$OUT/qwen38.run"
          sed 's/BINARY_NAME/coli/'   scripts/run-with-bundled-cuda.sh > "$OUT/coli.run"
          chmod 0755 "$OUT/qwen38.run" "$OUT/coli.run"

          # Prove both paths before shipping, with LD_LIBRARY_PATH cleared so
          # nothing on the runner can stand in for the bundle.
          #
          # `&&/||` rather than `; rc=$?`: this step runs under `set -e`, so a
          # bare ./qwen38 exiting non-zero kills the step before the code is
          # ever recorded. Run 36795504752 failed exactly there.
          #
          # Both 126 and 127 are fatal, and they are different bugs:
          #   127  the loader could not open libcudart -> the bundle is ignored
          #   126  the file is not executable -> the tarball ships a dead file
          # Checking only for 127 would let a 126 pass as "it started".
          ( cd "$OUT"
            unset LD_LIBRARY_PATH
            ./qwen38     --help >/dev/null 2>&1 && bare=0 || bare=$?
            ./qwen38.run --help >/dev/null 2>&1 && wrapped=0 || wrapped=$?
            ./coli.run   --help >/dev/null 2>&1 || true
            echo "bare qwen38 exit:   $bare"
            echo "wrapper exit:       $wrapped"
            for code in "$bare" "$wrapped"; do
              case "$code" in
                126) echo "!!! a shipped file is not executable" >&2; exit 1 ;;
                127) echo "!!! the loader could not open libcudart" >&2; exit 1 ;;
              esac
            done )
          ls -lh "$OUT/" "$OUT/lib/"

      - name: Verify the CUDA artifact is not a single-arch stub
        # Deliberately a separate step, not a block inside the bash -c above.
        # That body is one double-quoted argument, so a $(...) inside it is
        # not escaped for the runner's shell and blows up with "syntax error
        # near unexpected token '('". Verified by running this workflow.
        #
        # A build with no GPU and no CUDA_ARCH=portable produces a fatbin
        # carrying a single default arch (sm_52 on CUDA 12.x, below this
        # project's sm_75 floor). It still ships a .nv_fatbin section and links
        # libcudart, so presence and size checks both pass -- and the binary
        # then dies at first kernel dispatch on every real card.
        run: |
          set -euo pipefail
          FAT="binaries/cuda-${{ matrix.cuda_version_short }}/backend_cuda.o"
          if [ ! -f "$FAT" ]; then
            echo "!!! $FAT missing -- nvcc never ran" >&2
            exit 1
          fi
          SM_COUNT=$(strings "$FAT" | grep -oE 'sm_[0-9]{2}' | sort -u | tr '\n' ' ')
          echo "archs in fatbin: ${SM_COUNT:-none-labelled}"
          if printf '%s' "$SM_COUNT" | grep -qE 'sm_5[23]'; then
            echo "!!! default/fallback arch (sm_5x) present -- CUDA_ARCH was not portable" >&2
            exit 1
          fi
          ls -lh "$FAT" binaries/cuda-${{ matrix.cuda_version_short }}/

      - name: Clean up the staged runtime
        if: always()
        run: rm -rf cuda-runtime

      - name: Create tarball
        run: |
          cd binaries
          tar -czf colibri-${{ needs.check-release.outputs.release_tag }}-cuda-${{ matrix.cuda_version_short }}-${{ matrix.arch.suffix }}.tar.gz cuda-${{ matrix.cuda_version_short }}
          ls -lh *.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          # Arch suffix in the artifact name so the matrix jobs do not collide
          # in actions/download-artifact later.
          name: colibri-cuda-${{ matrix.cuda_version_short }}-${{ matrix.arch.suffix }}
          path: binaries/*.tar.gz
          retention-days: 7

  release:
    needs: [check-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags so the tag push below is a fast-forward and
          # duplicate tags are visible.
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -name "*.tar.gz" -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - name: Move the release tag forward
        run: |
          set -euo pipefail
          TAG="${{ needs.check-release.outputs.release_tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Colibri ${TAG} CUDA build $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # -f and --force are required, not optional. softprops/action-gh-release
          # has already created this tag at the static main HEAD by the time we
          # get here, so a plain `git tag` dies with "already exists". The tag
          # is a build marker for this repo alone -- the real v1.12.1 lives in
          # JustVugg/colibri -- so moving it forward is what makes the point.
          git tag -f "${TAG}"
          git push --force origin "refs/tags/${TAG}"
          echo "tag ${TAG} now points at $(git rev-parse --short HEAD)"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.check-release.outputs.release_tag }}
          name: colibri ${{ needs.check-release.outputs.release_tag }} with CUDA
          body: |
            colibri ${{ needs.check-release.outputs.release_tag }} with CUDA

            Prebuilt `qwen38` and `coli` from JustVugg/colibri, compiled for CUDA 12.8.

            **Source:** https://github.com/JustVugg/colibri/releases/tag/${{ needs.check-release.outputs.release_tag }}
            **Colibri commit:** `${{ needs.check-release.outputs.release_hash }}`

            ## GPU support

            SASS for compute capability 8.0, 8.6, 8.9, 9.0 and 12.0, plus a compute_120 PTX payload so cards newer than that JIT on first run.

            | Compute capability | Cards |
            |---|---|
            | 8.0 | A100 |
            | 8.6 | RTX 3000 series |
            | 8.9 | RTX 4000 series, L4, L40 |
            | 9.0 | H100, H200, GH200 |
            | 12.0 | RTX 5000 series, RTX Pro |

            Turing (7.5) and Blackwell datacenter (10.0) are not built. Colibri's portable list starts at sm_80 and does not carry sm_100.

            Needs NVIDIA driver 570.15 or newer.

            ## Host architecture

            x86-64 only. There is no arm64 tarball.

            ## What you need on the host

            No CUDA toolkit. The one CUDA library the binary loads ships in
            `cuda-12.8/lib/`, and RUNPATH points at it, so `./qwen38` runs as
            downloaded.

            Still required from the system, because they are not bundled:
            glibc 2.34 or newer, `libgomp.so.1` (the OpenMP runtime the CUDA
            build links) and `libstdc++.so.6`. A slim image may lack them:

            ```bash
            apt install libgomp1 libstdc++6   # Debian, Ubuntu
            dnf install libgomp libstdc++     # Fedora, RHEL
            ```

            `qwen38` is a glibc binary, so it will not run on musl-based
            systems.

            ## Usage

            ```bash
            tar -xzf colibri-${{ needs.check-release.outputs.release_tag }}-cuda-12.8-amd64.tar.gz
            cd cuda-12.8
            ./qwen38 --help
            ./coli info
            ```

            ## Check what you downloaded

            ```bash
            strings backend_cuda.o | grep -oE 'sm_[0-9]{2}' | sort -u
            ```

            Expect 80, 86, 89, 90, 120. A lone `sm_52` means a build from before the portable-arch fix, and it faults on the first kernel dispatch.

            The binaries link statically, so there is no shared library to install. `libcudart.so.12` comes from the CUDA 12.8 runtime and has to be on the loader path.
